<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cité 33</title>
<link rel="stylesheet" href="../../assets/css/tailwind.css?v=202610261400">
<style>
    body { background: radial-gradient(ellipse at 50% 40%, #10142a 0%, #04050c 70%); }
    /* Le plateau est le plus grand carré qui tient dans la zone centrale */
    #zone { container-type: size; }
    #plateau { width: min(100cqw, 100cqh); aspect-ratio: 1; }
    #carte { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
    #toast { transition: opacity .4s, transform .4s; }
    #toast.cache { opacity: 0; transform: translate(-50%, -8px); }
    @keyframes lueur { 0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,.5); } 50% { box-shadow: 0 0 0 6px rgba(212,175,55,0); } }
    .lueur { animation: lueur 1.6s ease-in-out infinite; }
</style>
</head>
<body class="h-[100dvh] overflow-hidden font-sans text-slate-200 antialiased">
    <div class="flex h-full flex-col">
        <header class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 pt-3">
            <h1 class="text-lg font-bold tracking-tight text-white">Cité <span class="text-brand-gold">33</span></h1>
            <div id="hud" class="order-last flex w-full flex-wrap items-center justify-center gap-1.5 md:order-none md:w-auto md:flex-1"></div>
            <div class="ml-auto flex items-center gap-1 md:ml-0">
                <div id="reliques" class="mr-1 flex gap-1"></div>
                <button id="btn-chronique" title="Chronique" class="grid h-8 w-8 place-items-center rounded-full text-slate-400 hover:bg-white/10 hover:text-white">📜</button>
                <button id="btn-aide" title="Aide" class="grid h-8 w-8 place-items-center rounded-full text-slate-400 hover:bg-white/10 hover:text-white">?</button>
                <button id="btn-nouvelle" title="Nouvelle partie" class="grid h-8 w-8 place-items-center rounded-full text-slate-400 hover:bg-white/10 hover:text-white">↺</button>
            </div>
        </header>

        <main id="zone" class="flex min-h-0 flex-1 items-center justify-center p-3">
            <div id="plateau" class="relative">
                <canvas id="carte"></canvas>4
                <div id="infobulle" class="pointer-events-none absolute z-10 hidden max-w-[220px] rounded-xl bg-slate-950/90 px-3 py-2 text-sm shadow-xl ring-1 ring-white/10 backdrop-blur"></div>
                <div id="toast" class="cache pointer-events-none absolute left-1/2 top-2 z-20 -translate-x-1/2 whitespace-nowrap rounded-full bg-slate-950/90 px-4 py-1.5 text-sm shadow-xl ring-1 ring-white/10 backdrop-blur"></div>
            </div>
        </main>

        <footer class="relative flex items-center justify-center gap-2 px-3 pb-4 sm:gap-3">
            <div id="detail" class="pointer-events-none absolute bottom-full left-1/2 mb-2 hidden w-64 -translate-x-1/2 rounded-xl bg-slate-950/95 px-3 py-2 text-xs shadow-xl ring-1 ring-white/10 backdrop-blur"></div>
            <button id="btn-relancer" class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white/5 text-xs text-slate-300 ring-1 ring-white/10 hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-30"></button>
            <div id="main" class="flex min-w-0 max-w-[26rem] flex-1 gap-2 sm:flex-none"></div>
            <button id="btn-fin" class="h-11 shrink-0 rounded-full bg-brand-gold px-4 text-sm font-semibold text-slate-900 hover:brightness-110 sm:px-5"></button>
        </footer>
    </div>

    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
        <div id="modal-contenu" class="max-h-full w-full max-w-2xl overflow-y-auto rounded-2xl bg-slate-900 p-6 shadow-2xl ring-1 ring-white/10"></div>
    </div> 

    <script type="module" src="game.js?v=202614/10/18:157777"></script>
</body>
</html>
