# Publie le dossier portfolio/ sur GitHub Pages à chaque push sur main
# (Tailwind est recompilé pour que tailwind.css soit toujours à jour).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois ; le plus récent l'emporte
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Compiler Tailwind
        run: |
          npm ci
          npm run build:css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - id: deployment
        uses: actions/deploy-pages@v4
